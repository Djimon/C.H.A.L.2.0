name: FixAgentDebugManager

on:
  workflow_dispatch: {}  # manuell starten

permissions:
  contents: write        # Branch + Commit + Push
  issues: write          # Issues kommentieren/schließen
  pull-requests: write   # PR erstellen (falls erlaubt)

jobs:
  fix-debug-manager:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gitpython

      - name: Configure git user
        run: |
          git config user.name "debug-manager-bot"
          git config user.email "debug-manager-bot@users.noreply.github.com"

      - name: Run DebugManager Fix Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        # bei Bedarf durch PAT ersetzen
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: "master"                            # bei dir: master
        run: |
          python .github/scripts/fix_debug_manager_agent.py
