name: DocGen

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      FULL_SCAN:
        description: '[FULL_SCAN]: Scan entire repo (true/false)'
        required: false
        default: 'false'
      DOCGEN_DRY_RUN:
        description: '[DOCGEN_DRY_RUN]: Generate docs without commit/push (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  gen-docs:
    #if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests openai gitpython

      - name: Run doc generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: master
          DOCGEN_DRY_RUN: "false"      # ggf. "true" für Test ohne PR
          DOCGEN_EXCLUDE_DIRS: "BayatGames,MatthewAssets,ThirdParty,Packages,Plugins,External"
          DOCGEN_ALLOWED_NS: "CHAL,global"
          DOCGEN_EXCLUDE_NS: "BayatGames,MatthewAssets"
          DOCGEN_CODE_CHANGE_RATE: 0.1
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FULL_SCAN: ${{ github.event.inputs.FULL_SCAN }}
        run: |
          python .github/scripts/docgen.py
