name: DocGen

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      FULL_SCAN:
        description: 'Scan entire repo (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  gen-docs:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install openai gitpython

      - name: Run doc generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FULL_SCAN: ${{ github.event.inputs.FULL_SCAN }}
        run: |
          python .github/scripts/docgen.py

      - name: Commit & push changes if any
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "doc-bot"
            git config user.email "doc-bot@users.noreply.github.com"
            git add -A
            git commit -m "docs: auto-update"
            git push
          else
            echo "No documentation changes."
          fi
