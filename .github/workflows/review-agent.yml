name: ReviewAgent

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      FULL_SCAN:
        description: 'Scan all files instead of only changed (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # nötig für git diff HEAD~1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gitpython requests

      - name: Run ReviewAgent
        env:
          # nur bei workflow_dispatch gibt es github.event.inputs.FULL_SCAN
          FULL_SCAN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.FULL_SCAN || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # <--- Token für API
          GITHUB_REPOSITORY: ${{ github.repository }} # owner/repo
          DEFAULT_BRANCH: "master"
        run: |
          python .github/scripts/review_agent.py
