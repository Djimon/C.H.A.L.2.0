name: FixAgentDebugLanguage

on:
  workflow_dispatch: {}  # manuell starten

permissions:
  contents: write        # Branch + Commit + Push
  issues: write          # Issues kommentieren/schließen
  pull-requests: write   # PR erstellen (wenn Org das erlaubt)

jobs:
  fix-debug-language:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gitpython openai

      - name: Configure git user
        run: |
          git config user.name "debug-language-bot"
          git config user.email "debug-language-bot@users.noreply.github.com"

      - name: Run DebugLanguage Fix Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        # oder dein PAT, falls nötig
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BASE_BRANCH: "master"                            # bei dir: master
        run: |
          python .github/scripts/fix_debug_language_agent.py
